<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Naomi Beauty Shop — Records</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F4F6;--surface:#FFFFFF;--surface2:#F2ECF0;--ink:#2A1F29;--muted:#74667A;--line:#E5DBE2;
  --plum:#4A2142;--plum-ink:#F6E9F1;--berry:#A3245F;--berry-ink:#FFFFFF;--berry-soft:#F8E4ED;
  --ok:#2F7D59;--ok-soft:#E3F2EA;--warn:#A86A12;--warn-soft:#FBF0DC;--bad:#B42318;--bad-soft:#FBE6E4;
  --r-sm:6px;--r:10px;--r-lg:16px;
  --font:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17111A;--surface:#211A24;--surface2:#2A212D;--ink:#F2EAF0;--muted:#A99BAA;--line:#3A2F3D;
    --plum:#100B12;--plum-ink:#F2E3EC;--berry:#E0659B;--berry-ink:#1A0E14;--berry-soft:#3A1D2C;
    --ok:#5CC08F;--ok-soft:#173226;--warn:#E3A84B;--warn-soft:#352812;--bad:#F07D72;--bad-soft:#3A1916;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17111A;--surface:#211A24;--surface2:#2A212D;--ink:#F2EAF0;--muted:#A99BAA;--line:#3A2F3D;
  --plum:#100B12;--plum-ink:#F2E3EC;--berry:#E0659B;--berry-ink:#1A0E14;--berry-soft:#3A1D2C;
  --ok:#5CC08F;--ok-soft:#173226;--warn:#E3A84B;--warn-soft:#352812;--bad:#F07D72;--bad-soft:#3A1916;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--berry);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
/* Sidebar */
.side{background:var(--plum);color:var(--plum-ink);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:0 10px 18px}
.brand h1{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.05;margin:0;letter-spacing:-.01em}
.brand p{margin:6px 0 0;font-size:13px;opacity:.7}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:inherit;padding:9px 12px;border-radius:var(--r-sm);cursor:pointer;font-weight:500;opacity:.82}
.nav button:hover{background:rgba(255,255,255,.07);opacity:1}
.nav button.on{background:rgba(255,255,255,.13);opacity:1}
.nav svg{width:18px;height:18px;flex:none}
.save-box{margin-top:auto;padding:12px;border-radius:var(--r);background:rgba(255,255,255,.06);font-size:12.5px;line-height:1.45}
.save-box b{display:block;font-size:13px;margin-bottom:2px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#7BD3A4;vertical-align:middle}
.dot.warn{background:#F2B85B}.dot.bad{background:#F07D72}.dot.off{background:#9A8C9C}
/* Main */
.main{padding:26px 30px 60px;min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.head h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em}
.head p{margin:2px 0 0;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel h3{margin:0 0 12px;font-size:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.stat span{color:var(--muted);font-size:13px}
.stat strong{display:block;font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted)}
.today{background:var(--berry);color:var(--berry-ink);border-radius:var(--r-lg);padding:22px 24px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-end}
.today .big{font-family:var(--display);font-size:44px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.today p{margin:0 0 6px;opacity:.85}
.today .mini{display:flex;gap:26px;flex-wrap:wrap}
.today .mini div{font-size:13px;opacity:.9}
.today .mini b{display:block;font-size:18px}
/* Buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:var(--r-sm);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--berry);border-color:var(--berry);color:var(--berry-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.lg{padding:12px 18px;font-size:16px}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
input.i,select.i,textarea.i{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:8px 10px;width:100%;color:var(--ink);font-size:14.5px}
textarea.i{min-height:70px;resize:vertical}
input.i:focus,select.i:focus,textarea.i:focus{outline:none;border-color:var(--berry);box-shadow:0 0 0 3px var(--berry-soft)}
.fg{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.fg .full{grid-column:1/-1}
/* Tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12.5px;color:var(--muted);font-weight:600;background:var(--surface2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:hover{background:var(--surface2)}
.empty{padding:34px;text-align:center;color:var(--muted)}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.pri{background:var(--berry-soft);color:var(--berry)}
.muted{color:var(--muted)}.okc{color:var(--ok)}.badc{color:var(--bad)}.warnc{color:var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:500}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:96px}
.pc:hover{border-color:var(--berry)}
.pc b{font-weight:600;line-height:1.25}
.pc .p{margin-top:auto;font-weight:700;color:var(--berry);font-variant-numeric:tabular-nums}
.pc small{color:var(--muted);font-size:12px}
.pc.low small{color:var(--warn)}.pc.out small{color:var(--bad)}
.cart{position:sticky;top:20px}
.cl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cl .nm{font-weight:600}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r-sm)}
.qty button{border:0;background:none;width:28px;height:28px;cursor:pointer;font-size:16px}
.qty input{width:46px;border:0;text-align:center;background:none;padding:0}
.pin{width:92px;border:1px solid var(--line);border-radius:var(--r-sm);padding:3px 6px;text-align:right;background:var(--surface)}
.tot{display:flex;justify-content:space-between;padding:4px 0;font-variant-numeric:tabular-nums}
.tot span:last-child{white-space:nowrap}
a{color:var(--berry)}
.tot.g{font-size:20px;font-weight:700;padding-top:8px}
.pay{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pay button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:8px 4px;cursor:pointer;font-weight:600;font-size:13px}
.pay button.on{border-color:var(--berry);background:var(--berry-soft);color:var(--berry)}
/* Bars */
.bars{display:flex;align-items:flex-end;gap:5px;height:150px;padding-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.bars i{display:block;width:100%;background:var(--berry);border-radius:4px 4px 0 0;min-height:2px;opacity:.85}
.bars div.t i{opacity:1}
.bars small{font-size:10.5px;color:var(--muted);white-space:nowrap}
.hbar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:4px}
.hbar i{display:block;height:100%;background:var(--berry)}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(20,10,18,.5);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:50;overflow:auto}
.md{background:var(--surface);border-radius:var(--r-lg);width:100%;max-width:560px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.md.wide{max-width:860px}
.md h3{margin:0 0 4px;font-size:19px}
.md .sub{color:var(--muted);margin:0 0 16px}
.md .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;font-weight:600;z-index:80;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.alert{padding:12px 14px;border-radius:var(--r);margin-bottom:14px;font-size:14px}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
pre.code{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;overflow:auto;font-size:12.5px;line-height:1.5;white-space:pre}
.sep{height:1px;background:var(--line);margin:16px 0}
.list-line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.list-line:last-child{border-bottom:0}
#print{display:none}
@media (max-width:1100px){.pos{grid-template-columns:1fr}.cart{position:static}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));overflow-x:auto;z-index:20;gap:6px}
  .brand{padding:0 8px 0 0;flex:none}.brand h1{font-size:18px}.brand p{display:none}
  .nav{display:flex;gap:2px}.nav button{white-space:nowrap;padding:8px 10px}.nav button span{display:none}.nav button.on span{display:inline}
  .save-box{margin:0;flex:none;padding:6px 10px}.save-box small{display:none}
  .main{padding:18px 14px 70px}
  .g2,.g3,.fg{grid-template-columns:1fr}
  .today .big{font-size:36px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  @page{margin:10mm}
  body{background:#fff;color:#000}
  .app,.ov,.toast{display:none!important}
  #print{display:block!important;font:12px/1.4 Arial,sans-serif;color:#000}
  #print.receipt{width:72mm;margin:0 auto;font-size:11.5px}
  #print table{font-size:inherit}#print th,#print td{border-color:#ccc;padding:5px 6px;background:none;color:#000}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><h1 id="brandName">Naomi Beauty Shop</h1><p id="brandLoc">Githiga</p></div>
    <nav class="nav" id="nav"></nav>
    <div class="save-box" id="saveBox"></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="modalRoot"></div>
<div id="print"></div>
<script>
/* ============ Naomi Beauty Shop — records app ============
   Data lives in one object (S). Every change is written to this
   computer immediately, again on a timer, and synced to Supabase. */
const KEY='naomiShop.data.v1', CLOUD_KEY='naomiShop.cloud.v1';
const DEFAULT_URL='https://xschfdgrlbgcouqaepsp.supabase.co', DEFAULT_KEY='sb_publishable_4aeaSsBVJU8f_F_0H0GpGg_2-CQU-bC';
const ICONS={
 dash:'<path d="M3 13h8V3H3zM13 21h8v-8h-8zM3 21h8v-6H3zM13 3v8h8V3z"/>',
 sell:'<path d="M6 6h15l-1.5 9h-12zM6 6 5 3H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/>',
 sales:'<path d="M6 2h9l5 5v15H6zM14 2v6h6M9 13h8M9 17h8"/>',
 prod:'<path d="M3 7l9-4 9 4-9 4zM3 7v10l9 4 9-4V7M12 11v10"/>',
 buy:'<path d="M4 4h16v4H4zM6 8v12h12V8M10 12h4"/>',
 exp:'<path d="M3 6h18v12H3zM3 10h18M7 15h3"/>',
 cust:'<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-6"/>',
 supp:'<path d="M1 7h13v10H1zM14 10h4l4 4v3h-8M5 20a2 2 0 1 0 0-.1M18 20a2 2 0 1 0 0-.1"/>',
 rep:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 set:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'
};
const NAV=[['dash','Dashboard'],['sell','Sell'],['sales','Sales & invoices'],['prod','Products & stock'],['buy','Purchases'],['exp','Expenses'],['cust','Customers'],['supp','Suppliers'],['rep','Reports'],['set','Settings & backup']];
const METHODS=['Cash','M-Pesa','Card','Bank'];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(/,/g,''));return isFinite(n)?n:0};
const r2=n=>Math.round((+n||0)*100)/100;
const fmt=n=>(+n||0).toLocaleString('en-KE',{minimumFractionDigits:2,maximumFractionDigits:2});
const money=n=>(S?.settings?.currency||'KES')+' '+fmt(n);
const qf=n=>(+n||0).toLocaleString('en-KE',{maximumFractionDigits:2});
const dISO=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};
const today=()=>dISO(new Date());
const nowTime=()=>new Date().toTimeString().slice(0,5);
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return dISO(d)};
const niceDate=iso=>iso?new Date(iso+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
const ago=t=>{if(!t)return 'never';const s=(Date.now()-t)/1000;if(s<10)return 'just now';if(s<60)return Math.floor(s)+' sec ago';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' hr ago';return new Date(t).toLocaleString('en-GB')};
function toast(msg,ms=2600){document.querySelectorAll('.toast').forEach(x=>x.remove());const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}

/* ---------- data model ---------- */
function blank(){
 return {
  settings:{shopName:'Naomi Beauty Shop',location:'Githiga',phone:'',email:'',kraPin:'',currency:'KES',
   receiptFooter:'Thank you for shopping with us!',invoiceTerms:'Payment due within 14 days.',autosaveMin:5,allowNegative:true},
  categories:['Hair products','Beauty & skin care','Perfumes','Shoes','Eggs','Other'],
  expenseCats:['Rent','Electricity','Water','Transport','Salaries','Airtime & data','Licences & permits','Packaging','Repairs','Other'],
  products:[],customers:[],suppliers:[],sales:[],purchases:[],expenses:[],moves:[],
  counters:{receipt:1,invoice:1,purchase:1},
  meta:{rev:0,updatedAt:null,created:new Date().toISOString()}
 };
}
let S, cloud, lastLocalSave=0, unsyncedSince=null;
function loadLocal(){
 try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
 const b=blank();
 if(!S||typeof S!=='object')S=b;
 for(const k in b) if(S[k]===undefined) S[k]=b[k];
 S.settings={...b.settings,...S.settings};S.counters={...b.counters,...S.counters};S.meta={...b.meta,...S.meta};
 try{cloud=JSON.parse(localStorage.getItem(CLOUD_KEY))}catch(e){cloud=null}
 cloud={url:'',key:'',shopId:'naomi-beauty-githiga',auto:true,everyMin:5,syncedRev:0,lastSync:0,lastError:'',dirty:false,...(cloud||{})};
 if(!cloud.url)cloud.url=DEFAULT_URL; if(!cloud.key)cloud.key=DEFAULT_KEY;
}
function saveLocal(silent){
 try{
  localStorage.setItem(KEY,JSON.stringify(S));
  localStorage.setItem(CLOUD_KEY,JSON.stringify(cloud));
  lastLocalSave=Date.now();
 }catch(e){
  if(!silent) toast('This computer’s storage is full. Export a backup in Settings and turn on cloud sync.',6000);
 }
 renderSaveBox();
}
/* every change goes through commit(): bump revision, save now, mark for cloud */
function commit(){
 S.meta.rev++;S.meta.updatedAt=new Date().toISOString();
 cloud.dirty=true;if(!unsyncedSince)unsyncedSince=Date.now();
 saveLocal();scheduleCloud();
}
const hasData=d=>d&&((d.products||[]).length+(d.sales||[]).length+(d.expenses||[]).length+(d.customers||[]).length+(d.purchases||[]).length)>0;

/* ---------- Supabase cloud sync ----------
   Safety rules (so an old or fresh copy of this file never wipes the cloud):
   1. Never push without first reading the cloud row.
   2. If the cloud changed since this computer last synced, stop and ask.
   3. A computer with no records always loads the cloud copy instead of pushing.
   4. Every push also keeps a dated snapshot (one per day) you can restore. */
let syncing=false, cloudTimer=null;
const cloudOn=()=>!!(cloud.url&&cloud.key&&cloud.shopId);
async function sb(path,opts={}){
 const base=cloud.url.trim().replace(/\/+$/,''),k=cloud.key.trim();
 const h={apikey:k,'Content-Type':'application/json',...(opts.headers||{})};
 if(k.startsWith('eyJ'))h.Authorization='Bearer '+k; // legacy anon JWT key
 let r;
 try{r=await fetch(base+'/rest/v1/'+path,{...opts,headers:h})}
 catch(e){throw new Error('Cannot reach Supabase — check the internet connection and the project URL.')}
 if(!r.ok){
  let t='',code='';try{const j=await r.json();t=j.message||j.msg||'';code=j.code||''}catch(e){}
  if(r.status===401||/api key|apikey|jwt/i.test(t))throw new Error('Supabase rejected the key — copy the publishable (or anon) key again from Project Settings → API Keys.');
  if(code==='42P01'||code==='PGRST205'||/does not exist|could not find the table/i.test(t))throw new Error('The tables were not found — run the setup SQL in the Supabase SQL Editor.');
  if(code==='42501'||/row-level security/i.test(t))throw new Error('Supabase blocked the write — the access policies from the setup SQL are missing.');
  throw new Error(t||('Cloud error '+r.status));
 }
 return r;
}

async function cloudGet(){const r=await sb('shop_data?id=eq.'+encodeURIComponent(cloud.shopId)+'&select=id,rev,updated_at,data');const a=await r.json();return a[0]||null}
async function snapshot(data,tag){
 const day=today();
 await sb('shop_snapshots',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},
  body:JSON.stringify({id:cloud.shopId+'_'+(tag||day),shop_id:cloud.shopId,day,data})});
}
async function pushNow(remote){
 const rev=((remote&&remote.rev)||0)+1;
 await sb('shop_data',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},
  body:JSON.stringify({id:cloud.shopId,rev,data:S,updated_at:new Date().toISOString()})});
 try{await snapshot(S)}catch(e){}
 cloud.syncedRev=rev;cloud.dirty=false;unsyncedSince=null;cloud.lastSync=Date.now();cloud.lastError='';
 saveLocal(true);
}
function applyRemote(remote){
 S=remote.data;loadFix();cloud.syncedRev=remote.rev;cloud.dirty=false;unsyncedSince=null;cloud.lastSync=Date.now();cloud.lastError='';
 saveLocal(true);render();
}
function loadFix(){const b=blank();for(const k in b) if(S[k]===undefined) S[k]=b[k];S.settings={...b.settings,...S.settings};S.counters={...b.counters,...S.counters};S.meta={...b.meta,...S.meta}}
async function syncCloud(manual){
 if(!cloudOn()){if(manual)toast('Add your Supabase details in Settings first.');return}
 if(syncing)return;
 if(!navigator.onLine){cloud.lastError='Offline — records are safe on this computer and will sync when internet returns.';renderSaveBox();return}
 syncing=true;renderSaveBox();
 try{
  const remote=await cloudGet();
  if(!remote){ if(hasData(S)||manual) await pushNow(null); }
  else if(remote.rev===cloud.syncedRev){ if(cloud.dirty) await pushNow(remote); }
  else if(!hasData(S)||(!cloud.dirty&&remote.rev>cloud.syncedRev)){ applyRemote(remote); toast('Loaded the latest records from the cloud.'); }
  else { conflict(remote); }
  if(manual&&!cloud.lastError)toast('Cloud sync complete.');
 }catch(e){cloud.lastError=e.message;if(manual)toast('Cloud sync failed: '+e.message,5000)}
 syncing=false;saveLocal(true);
}
function conflict(remote){
 window._remote=remote;if(document.querySelector('[data-conflict]'))return;
 const rc=remote.data||{};
 modal(`<h3 data-conflict>Two different copies of the records</h3>
 <p class="sub">The cloud copy was changed from another computer (or another copy of this file) since this computer last synced.</p>
 <div class="grid g2">
  <div class="panel"><h3>This computer</h3><div class="muted">Last change ${esc(S.meta.updatedAt?new Date(S.meta.updatedAt).toLocaleString('en-GB'):'—')}</div><div>${(S.sales||[]).length} sales, ${(S.products||[]).length} products</div></div>
  <div class="panel"><h3>Cloud</h3><div class="muted">Last change ${esc(rc.meta?.updatedAt?new Date(rc.meta.updatedAt).toLocaleString('en-GB'):'—')}</div><div>${(rc.sales||[]).length} sales, ${(rc.products||[]).length} products</div></div>
 </div>
 <p class="muted" style="margin-top:12px">Whichever you choose, the other copy is kept as a snapshot in the cloud, so nothing is lost.</p>
 <div class="acts"><button class="btn" onclick="closeModal()">Decide later</button>
 <button class="btn" onclick="resolveConflict('cloud')">Use cloud copy</button>
 <button class="btn pri" onclick="resolveConflict('local')">Keep this computer’s copy</button></div>`);
 window._remote=remote;
}
async function resolveConflict(which){
 const remote=window._remote;closeModal();
 try{
  if(which==='local'){await snapshot(remote.data,'replaced_'+Date.now());await pushNow(remote);toast('This computer’s copy is now in the cloud.')}
  else{const keep=JSON.parse(JSON.stringify(S));await snapshot(keep,'replaced_'+Date.now());applyRemote(remote);toast('Loaded the cloud copy.')}
 }catch(e){toast('Could not finish: '+e.message,5000)}
}
function scheduleCloud(){
 if(!cloudOn()||!cloud.auto)return;
 clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>syncCloud(false),30000);
}
function renderSaveBox(){

 else if(cloud.dirty){dot='warn';c='Cloud: waiting to sync'}

 el.innerHTML=`<b><span class="dot"></span>Saved on this computer</b><small>${ago(lastLocalSave)}<br></small><span class="dot ${dot}"></span><small style="display:inline">${c}</small>`;
}

  dueDate:credit?addDays(today(),14):'',notes:'',voided:false};

}

/* ================= SALES & INVOICES ================= */

function vSales(){

 let list=S.sales.filter(s=>{

  if(sf.tab==='receipt'&&s.kind!=='receipt')return false;

/* ---- CSV helpers ---- */
function parseCSV(t){const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);rows.push(r);r=[];f=''}else f+=c}if(f||r.length){r.push(f);rows.push(r)}return rows.filter(x=>x.some(v=>v.trim()))}
function downloadCSV(name,rows){
 const csv=rows.map(r=>r.map(v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function exportProductsCSV(){downloadCSV('products_'+today()+'.csv',[['Name','Code','Category','Unit','Cost','Price','Qty','Reorder'],...S.products.map(p=>[p.name,p.sku,p.category,p.unit,p.cost,p.price,p.qty,p.reorder])])}
function importProducts(){
 modal(`<h3>Import products from CSV</h3><p class="sub">Works with an item list exported from QuickBooks or Excel. The first row must be headings. Recognised headings: name (or item, product), code (sku, barcode), category (type), unit, cost (purchase cost, buying), price (sales price, selling, rate), qty (quantity on hand, stock), reorder.</p>
 <input type="file" accept=".csv,text/csv" id="impF" class="i">
 <label class="row" style="margin-top:10px"><input type="checkbox" id="impUpd" checked> Update products that already exist (matched by name)</label>
 <div class="acts"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="doImport()">Import</button></div>`);
}
function doImport(){
 const f=$('#impF').files[0];if(!f){toast('Choose a CSV file.');return}
 const upd=$('#impUpd').checked;
 f.text().then(t=>{
  const rows=parseCSV(t.replace(/^\ufeff/,''));if(rows.length<2){toast('The file has no rows.');return}
  const h=rows[0].map(x=>x.trim().toLowerCase());
  const col=(...k)=>h.findIndex(x=>k.some(y=>x===y||x.includes(y)));
  const c={name:col('name','item','product','description'),sku:col('sku','code','barcode'),cat:col('category','type','group'),unit:col('unit','uom'),
   cost:col('purchase cost','cost','buying'),price:col('sales price','selling','price','rate'),qty:col('quantity on hand','qty','quantity','stock','on hand'),re:col('reorder')};
  if(c.name<0){toast('No “name” column found.');return}
  let add=0,up=0;
  rows.slice(1).forEach(r=>{

 sl.forEach(s=>s.items.forEach(i=>{const c=i.pid?(prod(i.pid)?.category||'Other'):'Other items',rev=i.qty*i.price,pf=rev-i.qty*num(i.cost);

 const catA=Object.entries(cat).sort((a,b)=>b[1].rev-a[1].rev),catMax=Math.max(1,...catA.map(x=>x[1].rev));

 // daily

 const cred=S.suppliers.map(s=>[s,suppBal(s.id)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
 const L=(a,b,cls='')=>`<div class="tot ${cls}"><span>${a}</span><span>${b}</span></div>`;
 return head('Reports',`${niceDate(from)} to ${niceDate(to)}`,`<button class="btn" onclick="exportSalesCSV(true)">Export sales lines</button><button class="btn" onclick="printReport()">Print report</button>`)+
 `<div class="row" style="margin-bottom:16px"><div class="chips">${[['today','Today'],['week','This week'],['month','This month'],['last','Last month'],['year','This year']].map(([k,l])=>`<button class="chip ${rp.preset===k?'on':''}" onclick="setPreset('${k}')">${l}</button>`).join('')}</div>

 <div class="stat"><span>Net profit</span><strong class="${np<0?'badc':'okc'}">${money(np)}</strong><small>sales − cost − expenses</small></div></div>

  <div class="panel"><h3>Profit and loss</h3>${L('Sales before discounts',fmt(gross))}${L('Discounts given',(disc?'−':'')+fmt(disc))}${L('<b>Net sales</b>','<b>'+fmt(net)+'</b>')}${L('Cost of goods sold','−'+fmt(cogs))}${L('<b>Gross profit</b>','<b>'+fmt(gp)+'</b>')}
  ${Object.entries(exC).sort((a,b)=>b[1]-a[1]).map(([c,v])=>L('<span class="muted">'+esc(c)+'</span>','−'+fmt(v))).join('')}${L('Net profit',money(np),'g')}</div>
  <div class="panel"><h3>Money in and out by method</h3><div class="tw"><table><thead><tr><th>Method</th><th class="n">Received</th><th class="n">Paid out</th><th class="n">Net</th></tr></thead><tbody>
  ${METHODS.map(m=>`<tr><td>${m}</td><td class="n">${fmt(mi[m])}</td><td class="n">${fmt(mo[m])}</td><td class="n">${fmt(mi[m]-mo[m])}</td></tr>`).join('')}
  <tr><td><b>Total</b></td><td class="n"><b>${fmt(Object.values(mi).reduce((a,b)=>a+b,0))}</b></td><td class="n"><b>${fmt(Object.values(mo).reduce((a,b)=>a+b,0))}</b></td><td class="n"><b>${fmt(Object.values(mi).reduce((a,b)=>a+b,0)-Object.values(mo).reduce((a,b)=>a+b,0))}</b></td></tr></tbody></table></div>
  <p class="muted" style="font-size:13px;margin-bottom:0">Received includes payments on older invoices. Paid out is expenses plus supplier payments. Use the Cash row to check the drawer.</p></div>
 </div>
 <div class="panel" style="margin-top:16px"><h3>Sales by category</h3>${catA.length?catA.map(([c,v])=>`<div style="margin-bottom:10px"><div class="row"><b class="grow">${esc(c)}</b><span class="muted">${qf(v.q)} sold · profit ${fmt(v.pf)}</span><span style="min-width:110px;text-align:right">${fmt(v.rev)}</span></div><div class="hbar"><i style="width:${v.rev/catMax*100}%"></i></div></div>`).join(''):'<p class="muted">No sales in this period.</p>'}</div>
 <div class="grid g2" style="margin-top:16px">
  <div><h3 style="font-size:16px">Best-selling products</h3>${top.length?`<div class="tw"><table><thead><tr><th>Product</th><th class="n">Qty</th><th class="n">Sales</th><th class="n">Profit</th></tr></thead><tbody>${top.map(p=>`<tr><td>${esc(p.name)}</td><td class="n">${qf(p.q)}</td><td class="n">${fmt(p.rev)}</td><td class="n">${fmt(p.pf)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No sales in this period.</p>'}</div>
  <div><h3 style="font-size:16px">Day by day</h3>${dA.length?`<div class="tw" style="max-height:460px;overflow:auto"><table><thead><tr><th>Date</th><th class="n">Sales</th><th class="n">Amount</th><th class="n">Profit</th></tr></thead><tbody>${dA.map(([d,v])=>`<tr><td>${niceDate(d)}</td><td class="n">${v.n}</td><td class="n">${fmt(v.t)}</td><td class="n">${fmt(v.p)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No sales in this period.</p>'}</div>
 </div>
 <div class="grid g3" style="margin-top:16px">
  <div class="panel"><h3>Stock on hand today</h3>${Object.entries(sv).map(([c,v])=>L(esc(c)+` <span class="muted">(${v.n})</span>`,fmt(v.c))).join('')}${L('Value at cost',money(svT.c),'g')}${L('Value at selling price',fmt(svT.r))}</div>
  <div class="panel"><h3>Customers who owe</h3>${debt.length?debt.map(([c,b])=>L(esc(c.name),fmt(b))).join('')+L('Total',money(debt.reduce((a,x)=>a+x[1],0)),'g'):'<p class="muted">Nobody owes the shop.</p>'}</div>
  <div class="panel"><h3>Suppliers you owe</h3>${cred.length?cred.map(([s,b])=>L(esc(s.name),fmt(b))).join('')+L('Total',money(cred.reduce((a,x)=>a+x[1],0)),'g'):'<p class="muted">You owe no supplier.</p>'}</div>
 </div></div>`;
}
function exportSalesCSV(range){
 const from=range?rp.from:sf.from,to=range?rp.to:sf.to;
 const rows=[['Number','Type','Date','Time','Customer','Item','Category','Qty','Price','Amount','Unit cost','Profit','Sale discount','Sale total','Paid','Balance','Status']];
 S.sales.filter(s=>s.date>=from&&s.date<=to).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).forEach(s=>s.items.forEach((i,k)=>rows.push([s.no,s.kind,s.date,s.time,custName(s.customerId),i.name,i.pid?(prod(i.pid)?.category||''):'Other items',i.qty,i.price,r2(i.qty*i.price),i.cost,r2(i.qty*(i.price-i.cost)),k?'':s.discount,k?'':s.total,k?'':paidOf(s),k?'':balOf(s),statusOf(s)[0]])));
 downloadCSV('sales_'+from+'_to_'+to+'.csv',rows);
}

 const s=S.sales.find(x=>x.id===id),st=S.settings,title=s.kind==='invoice'?'INVOICE':'RECEIPT',bal=balOf(s);

  <table style="width:100%">${s.items.map(i=>`<tr><td colspan="2">${esc(i.name)}</td></tr><tr><td>${qf(i.qty)} × ${fmt(i.price)}</td><td style="text-align:right">${fmt(i.qty*i.price)}</td></tr>`).join('')}</table><hr>

  <table style="width:100%;border-collapse:collapse"><thead><tr><th style="border-bottom:2px solid #000;text-align:left">Item</th><th style="border-bottom:2px solid #000;text-align:right">Qty</th><th style="border-bottom:2px solid #000;text-align:right">Price</th><th style="border-bottom:2px solid #000;text-align:right">Amount</th></tr></thead><tbody>
  ${s.items.map(i=>`<tr><td style="border-bottom:1px solid #ccc">${esc(i.name)}</td><td style="border-bottom:1px solid #ccc;text-align:right">${qf(i.qty)}</td><td style="border-bottom:1px solid #ccc;text-align:right">${fmt(i.price)}</td><td style="border-bottom:1px solid #ccc;text-align:right">${fmt(i.qty*i.price)}</td></tr>`).join('')}</tbody></table>
  <table style="margin:12px 0 0 auto;min-width:260px">${s.discount?`<tr><td>Subtotal</td><td style="text-align:right">${fmt(s.subtotal)}</td></tr><tr><td>Discount</td><td style="text-align:right">-${fmt(s.discount)}</td></tr>`:''}
  <tr><td><b>Total</b></td><td style="text-align:right"><b>${money(s.total)}</b></td></tr><tr><td>Paid</td><td style="text-align:right">${fmt(paidOf(s))}</td></tr><tr><td><b>Balance due</b></td><td style="text-align:right"><b>${money(bal)}</b></td></tr></table>

 }

/* ================= SETTINGS & BACKUP ================= */
const SQL=`-- Run once in Supabase: SQL Editor > New query > Run
create table if not exists shop_data (
  id text primary key,
  rev integer not null default 0,
  data jsonb not null,
  updated_at timestamptz not null default now()
);
create table if not exists shop_snapshots (
  id text primary key,
  shop_id text not null,
  day date not null,
  data jsonb not null,
  created_at timestamptz not null default now()
);
alter table shop_data enable row level security;
alter table shop_snapshots enable row level security;
create policy "shop app access" on shop_data
  for all to anon using (true) with check (true);
create policy "shop app access" on shop_snapshots
  for all to anon using (true) with check (true);`;
function vSettings(){
 const st=S.settings,used=(new Blob([localStorage.getItem(KEY)||'']).size/1024/1024);
 return head('Settings & backup','Shop details, cloud sync and backups.')+
 `<div class="grid g2">
 <div class="panel"><h3>Shop details</h3><p class="muted" style="margin-top:-6px">Printed on receipts and invoices.</p><div class="fg">
  <label class="f full">Shop name<input class="i" id="stName" value="${esc(st.shopName)}"></label>
  <label class="f">Location<input class="i" id="stLoc" value="${esc(st.location)}"></label><label class="f">Phone<input class="i" id="stPhone" value="${esc(st.phone)}"></label>
  <label class="f">Email<input class="i" id="stEmail" value="${esc(st.email)}"></label><label class="f">KRA PIN<input class="i" id="stKra" value="${esc(st.kraPin)}"></label>
  <label class="f full">Message at the bottom of receipts<input class="i" id="stFoot" value="${esc(st.receiptFooter)}"></label>
  <label class="f full">Invoice payment terms<input class="i" id="stTerms" value="${esc(st.invoiceTerms)}"></label>
  <label class="f">Product categories (one per line)<textarea class="i" id="stCats" rows="6">${esc(S.categories.join('\n'))}</textarea></label>
  <label class="f">Expense categories (one per line)<textarea class="i" id="stECats" rows="6">${esc(S.expenseCats.join('\n'))}</textarea></label>
  <label class="f">Save to this computer every<select class="i" id="stAuto">${opt([[1,'1 minute'],[2,'2 minutes'],[5,'5 minutes'],[10,'10 minutes']],st.autosaveMin)}</select></label>
  <label class="f">Selling more than stock shows<select class="i" id="stNeg">${opt([['1','Allow, after a warning'],['0','Block the sale']],st.allowNegative?'1':'0')}</select></label>
 </div><p class="muted" style="font-size:13px">Every change is also saved the moment you make it — the timer is an extra safety net.</p>
 <div class="acts"><button class="btn pri" onclick="saveSettings()">Save settings</button></div></div>

 <div class="panel"><h3>Cloud sync (Supabase)</h3><p class="muted" style="margin-top:-6px">Keeps a copy online so records survive a broken or stolen computer, and lets a second computer use the same records.</p>
  ${cloud.lastError?`<div class="alert bad">${esc(cloud.lastError)}</div>`:cloudOn()&&cloud.lastSync?`<div class="alert ok">Last synced ${ago(cloud.lastSync)}.</div>`:''}
  <div class="fg"><label class="f full">Project URL<input class="i" id="cbUrl" value="${esc(cloud.url)}" placeholder="https://xxxx.supabase.co"></label>
  <label class="f full">Publishable / anon key<input class="i" id="cbKey" type="password" value="${esc(cloud.key)}" placeholder="sb_publishable_… or eyJ…"></label>
  <label class="f">Shop ID<input class="i" id="cbId" value="${esc(cloud.shopId)}"></label>
  <label class="f">Sync every<select class="i" id="cbEvery">${opt([[1,'1 minute'],[2,'2 minutes'],[5,'5 minutes'],[10,'10 minutes'],[15,'15 minutes']],cloud.everyMin)}</select></label>
  <label class="row full" style="gap:8px"><input type="checkbox" id="cbAuto" ${cloud.auto?'checked':''}> Sync automatically</label></div>
  <div class="acts" style="justify-content:flex-start"><button class="btn pri" onclick="saveCloud()">Save and sync now</button><button class="btn" onclick="saveCloudOnly();testCloud()">Test connection</button><button class="btn" onclick="pullCloud()">Load records from cloud</button><button class="btn" onclick="showSnapshots()">Restore a snapshot</button></div>
  <details style="margin-top:14px"><summary style="cursor:pointer;font-weight:600">First-time setup</summary>
  <p class="muted" style="font-size:13.5px">1. Create a free project at supabase.com. 2. Open SQL Editor, paste the code below and press Run. 3. In Project Settings → API copy the Project URL and the anon public key into the boxes above. 4. Use the same Shop ID on every computer that should share records.</p>
  <pre class="code">${esc(SQL)}</pre><button class="btn sm" onclick="navigator.clipboard.writeText(SQL).then(()=>toast('SQL copied.'))">Copy SQL</button></details>
 </div>

 <div class="panel"><h3>Backup file</h3><p class="muted" style="margin-top:-6px">Download a full copy to a flash disk or email it to yourself every week.</p>
  <div class="row"><button class="btn pri" onclick="exportBackup()">Download backup</button><label class="btn">Restore from backup file<input type="file" accept=".json" hidden onchange="importBackup(this.files[0])"></label></div>
  <p class="muted" style="font-size:13px">Records use ${used.toFixed(2)} MB of about 5 MB available on this computer.${used>3.5?' <b class="warnc">Getting full — keep cloud sync on and download backups.</b>':''}</p>
  ${S.meta.lastBackup?`<p class="muted" style="font-size:13px">Last backup downloaded ${niceDate(S.meta.lastBackup)}.</p>`:''}</div>

 <div class="panel"><h3>Erase this computer</h3><p class="muted" style="margin-top:-6px">Removes all records from this computer only. The cloud copy and backup files are not touched.</p>
  <button class="btn danger" onclick="eraseLocal()">Erase records on this computer</button></div>
 </div>`;
}
function saveSettings(){
 const st=S.settings,lines=id=>val(id).split('\n').map(x=>x.trim()).filter(Boolean);
 Object.assign(st,{shopName:val('stName').trim()||'Naomi Beauty Shop',location:val('stLoc').trim(),phone:val('stPhone').trim(),email:val('stEmail').trim(),kraPin:val('stKra').trim(),
  receiptFooter:val('stFoot'),invoiceTerms:val('stTerms'),autosaveMin:num(val('stAuto'))||5,allowNegative:val('stNeg')==='1'});
 const c=lines('stCats'),e=lines('stECats');if(c.length)S.categories=c;if(e.length)S.expenseCats=e;
 commit();startTimers();render();toast('Settings saved.');
}
function saveCloudOnly(){Object.assign(cloud,{url:val('cbUrl').trim(),key:val('cbKey').trim()});saveLocal(true)}
function saveCloud(){
 const changedId=val('cbId').trim()!==cloud.shopId;
 Object.assign(cloud,{url:val('cbUrl').trim(),key:val('cbKey').trim(),shopId:val('cbId').trim()||'naomi-beauty-githiga',auto:$('#cbAuto').checked,everyMin:num(val('cbEvery'))||5});
 if(changedId)cloud.syncedRev=0;
 saveLocal(true);startTimers();syncCloud(true).then(render);
}
function pullCloud(){
 if(!cloudOn()){toast('Add your Supabase details first.');return}
 confirmBox('Replace the records on this computer with the cloud copy? This computer’s current records are saved as a cloud snapshot first.',async()=>{
  try{const remote=await cloudGet();if(!remote){toast('There is no cloud copy yet.');return}
   await snapshot(S,'replaced_'+Date.now());applyRemote(remote);toast('Loaded records from the cloud.')}catch(e){toast('Could not load: '+e.message,5000)}
 },'Load cloud copy');
}
async function showSnapshots(){
 if(!cloudOn()){toast('Add your Supabase details first.');return}
 try{
  const r=await sb('shop_snapshots?shop_id=eq.'+encodeURIComponent(cloud.shopId)+'&select=id,day,created_at&order=created_at.desc&limit=40');const a=await r.json();
  modal(`<h3>Restore a snapshot</h3><p class="sub">One snapshot is kept per day, plus a copy whenever records were replaced.</p>
  ${a.length?a.map(x=>`<div class="list-line"><span>${niceDate(x.day)} <span class="muted">${x.id.includes('replaced_')?'· copy before replacing':'· end of day'} · ${new Date(x.created_at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</span></span><button class="btn sm" onclick="restoreSnap('${esc(x.id)}')">Restore</button></div>`).join(''):'<p class="muted">No snapshots yet.</p>'}
  <div class="acts"><button class="btn" onclick="closeModal()">Close</button></div>`);
 }catch(e){toast('Could not load snapshots: '+e.message,5000)}
}
function restoreSnap(id){
 confirmBox('Restore this snapshot? Current records are kept as another snapshot first.',async()=>{
  try{const r=await sb('shop_snapshots?id=eq.'+encodeURIComponent(id)+'&select=data');const a=await r.json();if(!a[0])return;
   await snapshot(S,'replaced_'+Date.now());S=a[0].data;loadFix();closeAll();commit();render();toast('Snapshot restored.')}catch(e){toast('Restore failed: '+e.message,5000)}
 },'Restore');
}
function exportBackup(){
 S.meta.lastBackup=today();saveLocal(true);
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));
 a.download=S.settings.shopName.replace(/\W+/g,'_')+'_backup_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function importBackup(f){
 if(!f)return;f.text().then(t=>{let d;try{d=JSON.parse(t)}catch(e){toast('That file is not a backup from this app.');return}
  if(!d.products||!d.sales){toast('That file is not a backup from this app.');return}
  confirmBox(`Replace all records on this computer with the backup (${d.sales.length} sales, ${d.products.length} products)?`,()=>{S=d;loadFix();commit();render();toast('Backup restored.')},'Restore backup');
 });
}
function eraseLocal(){
 modal(`<h3>Erase records on this computer?</h3><p class="sub">Type ERASE to confirm. Download a backup first if you are unsure.</p><input class="i" id="erTxt">
 <div class="acts"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="if(val('erTxt')==='ERASE'){localStorage.removeItem(KEY);cloud.syncedRev=0;cloud.dirty=false;S=blank();saveLocal(true);closeModal();go('dash');toast('Records erased from this computer.')}else toast('Type ERASE in capitals.')">Erase</button></div>`);
}

/* ================= START ================= */
let tLocal,tCloud;
function startTimers(){
 clearInterval(tLocal);clearInterval(tCloud);
 tLocal=setInterval(()=>saveLocal(true),(S.settings.autosaveMin||5)*60000);
 tCloud=setInterval(()=>{if(cloudOn()&&cloud.auto)syncCloud(false)},(cloud.everyMin||5)*60000);
}
window.addEventListener('beforeunload',()=>saveLocal(true));
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveLocal(true)});
window.addEventListener('online',()=>{cloud.lastError='';if(cloudOn()&&cloud.auto)syncCloud(false)});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){loadLocal();render();toast('Records were changed in another window — showing the latest.')}});
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveLocal();if(cloudOn())syncCloud(false);toast('Saved. Everything also saves by itself — no need to press save.')}
 if(e.key==='Escape'&&$('#modalRoot').children.length)closeModal();
});
setInterval(renderSaveBox,30000);
loadLocal();render();startTimers();saveLocal(true);
if(cloudOn()&&cloud.auto)setTimeout(()=>syncCloud(false),1200);
</script>
